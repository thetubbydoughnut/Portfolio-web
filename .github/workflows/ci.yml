name: CI

on:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Coverage
        run: |
          npm run test:coverage
          node -e "
          const fs = require('fs');
          const floor = JSON.parse(fs.readFileSync('coverage-floor.json','utf8'));
          const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json','utf8'));
          const pct = Math.floor(summary.total.statements.pct);
          if (pct < floor.statements) {
            console.error('Coverage floor miss:', pct, '<', floor.statements);
            process.exit(1);
          }
          console.log('Coverage statements', pct, '>= floor', floor.statements);
          "

      - name: Build
        run: npm run build
